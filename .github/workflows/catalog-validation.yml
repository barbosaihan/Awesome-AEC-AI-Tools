name: Catalog validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional positive PR number; validate its README files as data against main'
        required: false
        type: string

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR/push: bootstrap the workflow from the event SHA, including this first CI PR.
      # PR code runs with read-only token and no secrets. Dispatch uses trusted main;
      # its PR head is read as data by git show, never checked out or executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit tests (event code for PR/push; main for dispatch)
        run: python3 -m unittest discover -s tests -v
      - name: Validate catalog (dispatch PR ref is data, not code)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_INPUT: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request || -n "$PR_INPUT" ]]; then
            if [[ "$EVENT_NAME" == pull_request ]]; then
              number="$EVENT_PR_NUMBER"
            else
              number="$PR_INPUT"
            fi
            if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
              echo 'Invalid positive PR number' >&2
              exit 1
            fi
            if [[ "$EVENT_NAME" == pull_request ]]; then
              # Fetch the event base object; do not use potentially moving main as baseline.
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              base="$BASE_SHA"
            else
              base="$(git rev-parse HEAD)"
            fi
            git fetch --no-tags --depth=1 origin "+refs/pull/${number}/head:refs/remotes/origin/catalog-pr-head"
            head="$(git rev-parse refs/remotes/origin/catalog-pr-head)"
            if [[ "$EVENT_NAME" == pull_request && "$head" != "$HEAD_SHA" ]]; then
              echo 'PR head changed since event; rerun against the new event' >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == push && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" "$EVENT_SHA"
            base="$BEFORE_SHA"
            head="$EVENT_SHA"
          else
            # Manual run without PR: compare current main against its preceding commit.
            git fetch --no-tags --depth=2 origin main
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
          fi
          python3 scripts/check_readmes.py --base-ref "$base" --head-ref "$head"
